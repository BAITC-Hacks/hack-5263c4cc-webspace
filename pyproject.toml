[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "moneygraph"
version = "0.1.0"
description = "Explainable, local-first transaction graph investigation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "polars>=1.20,<2",
  "networkx>=3.4,<4",
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  "openai>=2,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
moneygraph = "moneygraph.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/moneygraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
